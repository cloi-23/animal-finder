name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest trained pet model
        run: |
          RUN_ID=$(gh run list --workflow train-dogs-cats-model.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "No successful dogs and cats training run is available."
            exit 1
          fi
          mkdir -p ios/App/App/Models
          gh run download "$RUN_ID" --name oxford-iiit-pet-model --dir ios/App/App/Models
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npm run ios:sync

      - name: Build unsigned iOS archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AnimalFinder.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS archive
        uses: actions/upload-artifact@v5
        with:
          name: animal-finder-ios-archive
          path: ${{ runner.temp }}/AnimalFinder.xcarchive
          retention-days: 3

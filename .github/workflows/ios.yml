name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest trained pet model
        run: |
          RUN_ID=$(gh run list --workflow train-dogs-cats-model.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "No successful dogs and cats training run is available."
            exit 1
          fi
          mkdir -p ios/App/App/Models
          gh run download "$RUN_ID" --name oxford-iiit-pet-model --dir ios/App/App/Models
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npm run ios:sync

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: login
          create-keychain: false
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/animal-finder.mobileprovision"

      - name: Build signed iOS archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AnimalFinder.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export signed IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store</string><key>signingStyle</key><string>manual</string><key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string><key>provisioningProfiles</key><dict><key>io.ionic.starter</key><string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string></dict></dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AnimalFinder.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: animal-finder-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 3

      - name: Upload iOS archive
        uses: actions/upload-artifact@v5
        with:
          name: animal-finder-ios-archive
          path: ${{ runner.temp }}/AnimalFinder.xcarchive
          retention-days: 3

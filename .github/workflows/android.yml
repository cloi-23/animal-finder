name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Download latest trained pet model
        run: |
          RUN_ID=$(gh run list \
            --workflow train-dogs-cats-model.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "No successful dogs and cats training run is available."
            exit 1
          fi
          gh run download "$RUN_ID" \
            --name oxford-iiit-pet-model \
            --dir android/app/src/main/assets/camera
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/animal-finder-release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/animal-finder-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose "$APK"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/animal-finder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-finder-release-apk
          path: android/app/build/outputs/apk/release/animal-finder.apk
          retention-days: 3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"

          gh release create "$TAG" \
            android/app/build/outputs/apk/release/animal-finder.apk \
            --repo "${{ github.repository }}" \
            --title "Animal Finder v${{ github.run_number }}" \
            --notes "Signed Android release APK built from commit ${{ github.sha }}."

      - name: Keep only the latest APK run, artifact, release, and tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow android.yml \
            --limit 100 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].databaseId' \
            | while read -r run_id; do
                [[ -z "$run_id" ]] || gh run delete "$run_id"
              done

          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq 'add | map(.artifacts[]) | map(select(.name == "animal-finder-release-apk")) | sort_by(.created_at) | reverse | .[1:] | .[].id' \
            | while read -r artifact_id; do
                [[ -z "$artifact_id" ]] || gh api --method DELETE \
                  "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
              done

          gh release list \
            --limit 100 \
            --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^v[0-9]+$"))) | sort_by(.createdAt) | reverse | .[1:] | .[].tagName' \
            | while read -r old_release; do
                [[ -z "$old_release" ]] || gh release delete "$old_release" --cleanup-tag --yes
              done

          gh api --paginate --slurp \
            "repos/${{ github.repository }}/tags?per_page=100" \
            --jq 'add | map(.name) | map(select(test("^v[0-9]+$"))) | sort_by(sub("^v"; "") | tonumber) | reverse | .[1:] | .[]' \
            | while read -r old_tag; do
                [[ -z "$old_tag" ]] || gh api --method DELETE \
                  "repos/${{ github.repository }}/git/refs/tags/$old_tag"
              done

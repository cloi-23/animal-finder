name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download animal database
        run: |
          mkdir -p public/database
          gh release download database-v1 \
            --repo "${{ github.repository }}" \
            --pattern "animals_mobile.sqlite" \
            --dir public/database
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-finder-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Animal Finder Android ${{ github.run_number }}
          body: |
            Android release build.

            Commit: ${{ github.sha }}

            Built automatically from main.
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

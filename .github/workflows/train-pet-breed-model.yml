name: Train Dog and Cat Breed Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: false
        default: "8"

permissions:
  contents: read
  actions: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install TensorFlow
        run: python -m pip install --upgrade pip tensorflow==2.16.1

      - name: Download dog and cat breed dataset
        run: |
          mkdir -p training-data
          curl -L --retry 3 --fail \
            https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz \
            -o training-data/images.tar.gz
          curl -L --retry 3 --fail \
            https://www.robots.ox.ac.uk/~vgg/data/pets/data/annotations.tar.gz \
            -o training-data/annotations.tar.gz

      - name: Extract dataset
        run: |
          tar -xzf training-data/images.tar.gz -C training-data
          tar -xzf training-data/annotations.tar.gz -C training-data

      - name: Train and convert dog and cat model
        run: |
          python tools/train_pet_breed_model.py \
            --images training-data/images \
            --annotations training-data/annotations \
            --epochs "${{ inputs.epochs }}" \
            --output training-output/oxford_iiit_pet.tflite

      - name: Upload dog and cat TFLite model and labels
        uses: actions/upload-artifact@v5
        with:
          name: oxford-iiit-pet-model
          path: training-output/
          retention-days: 14

      - name: Keep only the latest training run and artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow train-pet-breed-model.yml \
            --limit 100 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].databaseId' \
            | while read -r run_id; do
                [[ -z "$run_id" ]] || gh run delete "$run_id"
              done

          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq 'add | map(.artifacts[]) | map(select(.name == "oxford-iiit-pet-model")) | sort_by(.created_at) | reverse | .[1:] | .[].id' \
            | while read -r artifact_id; do
                [[ -z "$artifact_id" ]] || gh api --method DELETE \
                  "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
              done

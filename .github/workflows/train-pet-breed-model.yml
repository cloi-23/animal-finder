name: Train Pet Breed Model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: false
        default: "8"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install TensorFlow
        run: python -m pip install --upgrade pip tensorflow==2.16.1

      - name: Download Oxford-IIIT Pet dataset
        run: |
          mkdir -p training-data
          curl -L --retry 3 --fail \
            https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz \
            -o training-data/images.tar.gz
          curl -L --retry 3 --fail \
            https://www.robots.ox.ac.uk/~vgg/data/pets/data/annotations.tar.gz \
            -o training-data/annotations.tar.gz

      - name: Extract dataset
        run: |
          tar -xzf training-data/images.tar.gz -C training-data
          tar -xzf training-data/annotations.tar.gz -C training-data

      - name: Train and convert model
        run: |
          python tools/train_pet_breed_model.py \
            --images training-data/images \
            --annotations training-data/annotations \
            --epochs "${{ inputs.epochs }}" \
            --output training-output/oxford_iiit_pet.tflite

      - name: Upload TFLite model and labels
        uses: actions/upload-artifact@v5
        with:
          name: oxford-iiit-pet-model
          path: training-output/
          retention-days: 14
